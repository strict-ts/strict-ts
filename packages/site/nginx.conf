# The site is a folder of files: nginx gives each as it is, and says so when there is none.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  # The compiler the playground loads is nine megabytes of script: it is sent compressed.
  gzip_types text/css text/javascript application/javascript image/svg+xml;

  location / {
    try_files $uri $uri/ =404;
  }
  # An address that is not a page is answered with the page that says so, and with its code.
  error_page 404 /404.html;
  # The pages name the commit they were built from, and the scripts have no name of their own: a page is asked again.
  add_header Cache-Control "no-cache";
}
