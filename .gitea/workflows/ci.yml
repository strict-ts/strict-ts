# Checks pull requests and main. On main, once everything passed, the packages a project installs are published
# on the npm registry of the Gitea under a pilot version named after the commit. Nothing is a release.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: node:22-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck and build
        run: pnpm build
      - name: Test
        run: pnpm test
      # The website: what the Dockerfile at the root builds.
      - name: Website
        run: pnpm site
      # strict-ts on its own sources, as a blocking check: only what the baselines record is tolerated.
      - name: strict-ts
        run: pnpm check
      # What the rules refuse on a fixed set of projects must not move without a word.
      - name: Corpus
        run: pnpm corpus
      # The same tests on instrumented code: what the probes see must not contradict the effects ledger.
      - name: Probes
        run: pnpm probe
      # The generated part of the effects ledger is what the generator gives: every function run again.
      - name: Ledger
        run: pnpm ledger
      # A pilot version of std, core and cli for the projects that try strict-ts. Not on a pull request: only what
      # is on main is published. It needs the secret PACKAGES_TOKEN, a token that may write packages: the token of
      # the run may not (tried: 401). Without the secret the step says so and publishes nothing.
      - name: Publish the pilot packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          NPM_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "The secret PACKAGES_TOKEN is not set: nothing is published."
          else
            pnpm publish:pilot
          fi
